{% extends "blog/base.html" %}

{% block title %}Lista de Posts{% endblock %}

{% block content %}
<h2>Posts publicados</h2>
<ul>
    {% for post in posts %}
    <li>
        {{ post.titulo }} - {{ post.autor.nombre }} - {{ post.categoria.nombre }}
        <a href="{% url 'editar_post' post.id %}">Editar</a> |
        <a href="{% url 'eliminar_post' post.id %}">Eliminar</a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
