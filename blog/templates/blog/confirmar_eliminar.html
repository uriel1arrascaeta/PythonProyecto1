{% extends "blog/base.html" %}

{% block title %}Eliminar Post{% endblock %}

{% block content %}
<h2>¿Estás seguro que querés eliminar este post?</h2>
<p><strong>{{ post.titulo }}</strong></p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'listar_posts' %}">Cancelar</a>
</form>
{% endblock %}
