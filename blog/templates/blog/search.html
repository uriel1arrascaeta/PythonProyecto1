{% extends "blog/base.html" %}

{% block title %}Buscar Posts{% endblock %}

{% block content %}
<h2>Buscar Posts</h2>
<form method="get">
    {{ form.as_p }}
    <button type="submit">Buscar</button>
</form>

{% if resultados %}
<ul>
    {% for post in resultados %}
    <li>{{ post.titulo }}</li>
    {% endfor %}
</ul>
{% endif %}
{% endblock %}
